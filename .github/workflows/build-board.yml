# Builds the board from the eight unit repositories and publishes it to GitHub Pages.
# The read token appears on the generate step only. A generator exit 3 fails the job and
# publishes nothing, so the previously deployed page keeps serving.
name: build-board

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/generate.mjs --repos-from manifest.json --out dist
        env:
          PROGRESS_READ_TOKEN: ${{ secrets.PROGRESS_READ_TOKEN }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
